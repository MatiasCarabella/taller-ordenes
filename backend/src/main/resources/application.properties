spring.application.name=taller-ordenes
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/taller?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:taller_app}
spring.datasource.password=${db_app_password:}
spring.flyway.url=${spring.datasource.url}
spring.flyway.user=${SPRING_FLYWAY_USER:taller_migrator}
spring.flyway.password=${db_migration_password:}
spring.flyway.clean-disabled=true
spring.flyway.validate-migration-naming=true
spring.datasource.hikari.maximum-pool-size=5
management.endpoints.web.base-path=/api
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
server.servlet.session.timeout=20m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
server.error.include-stacktrace=never
spring.main.banner-mode=off
server.servlet.session.persistent=false
server.servlet.session.cookie.path=/
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.forward-headers-strategy=native
