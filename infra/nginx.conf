worker_processes auto;
pid /tmp/nginx.pid;
# El registro técnico no incluye URL, query, IP, cabeceras ni cuerpos.
error_log /dev/null;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format tecnico '$request_method $status $request_time';
    access_log /dev/stdout tecnico;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    server_tokens off;
    client_max_body_size 256k;
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=1r/s;
    limit_req_status 429;
    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

        error_page 429 = @limited;
        location @limited {
            default_type application/problem+json;
            add_header Retry-After 1 always;
            return 429 '{"title":"Demasiadas solicitudes. Intentá nuevamente.","status":429,"code":"DEMASIADAS_SOLICITUDES"}';
        }
        location = /healthz { access_log off; return 200 "ok\n"; }
        location = /api/auth/login {
            limit_req zone=login burst=5 nodelay;
            include /etc/nginx/proxy-api.conf;
        }
        location /api/ {
            limit_req zone=api burst=60 nodelay;
            include /etc/nginx/proxy-api.conf;
        }
        location / { try_files $uri $uri/ /index.html; }
    }
}
